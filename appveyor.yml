version: 1.0.{build}
# the solution targets .NET 10, which needs the MSBuild that ships with Visual Studio 2026 - the
# Visual Studio 2022 MSBuild ignores the .NET 10 SDK and falls back to an older one (error NETSDK1045)
image: Visual Studio 2026
install:
# install the .NET 10 SDK only if the image doesn't already have it
- ps: |
    if (-not (dotnet --list-sdks | Where-Object { $_ -like "10.*" })) {
      Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile dotnet-install.ps1
      ./dotnet-install.ps1 -Channel 10.0 -InstallDir "$env:ProgramFiles\dotnet"
    }
    dotnet --list-sdks
before_build:
- cmd: dotnet restore ./source/Stateless.WorkflowEngine.sln
build_script:
# the web console's client (npm) build only runs on publish, so a plain build doesn't need node
- cmd: dotnet build ./source/Stateless.WorkflowEngine.sln -c Release --no-restore
test_script:
- cmd: dotnet test ./source/Stateless.WorkflowEngine.sln -c Release --no-build --filter "TestCategory!=RequiresMongoDb&TestCategory!=RequiresRavenDb"
