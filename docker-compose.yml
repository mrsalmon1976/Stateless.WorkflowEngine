services:

  mongodb:
    image: mongo:latest
    container_name: stateless_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  ravendb:
    image: ravendb/ravendb:latest
    container_name: stateless_ravendb
    ports:
      - "8080:8080"
      - "38888:38888"
    # unsecured dev instance - no setup wizard, accessible from the host and other containers
    environment:
      - RAVEN_Setup_Mode=None
      - RAVEN_License_Eula_Accepted=true
      - RAVEN_Security_UnsecuredAccessAllowed=PublicNetwork
    volumes:
      - ravendb_data:/opt/RavenDB/Server/RavenData
    restart: unless-stopped

  webconsole:
    build:
      context: ./source
      dockerfile: Stateless.WorkflowEngine.WebConsole/Dockerfile
    container_name: stateless_webconsole
    ports:
      - "8811:8080"
    volumes:
      - webconsole_data:/app/Data
    depends_on:
      - mongodb
      - ravendb
    restart: unless-stopped

volumes:
  mongodb_data:
  ravendb_data:
  webconsole_data:
